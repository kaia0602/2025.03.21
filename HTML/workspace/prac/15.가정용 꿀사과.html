<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가정용 꿀사과</title>
    <style>
        caption {
            color: white;
            background-color: black;
            text-align: start;
            padding: 10px;
        }

        table {
            border-collapse: collapse;
            text-align: center;
            width: 640px;
            font-weight: bold;
        }

        tr,
        td {
            border: 1px solid black;
            padding: 30px;
        }

        .txtRed {
            color: #FF0003;
            font-weight: bolder;
            font-size: large;
        }

        .txtBlue {
            color: #101CFF;
            font-weight: bold;
        }

        .txtSmall {
            font-size: x-small;
        }
    </style>
</head>

<body>
    <div>
        <img src="../images/가정용꿀사과.jpg" alt="apple">
    </div>
    <div class="check">
        <table>
            <caption>확인하세요</caption>
            <tr>
                <td>
                    <span class="txtRed">주문 및 배송</span>
                    <p><span class="txtBlue">오후 2시 이전</span> 주문건은 당일 발송합니다<br>
                        2시 이후 주문건은 다음날 발송합니다(주말제외)</p>
                </td>
            </tr>
            <tr>
                <td>
                    <span class="txtRed">교환 및 환불</span>
                    <p>불만족시 <span class="txtBlue">100% 환불</span>해 드립니다<br>
                        고객센터로 전화주세요</p>
                </td>
            </tr>
            <tr>
                <td>
                    <span class="txtRed">고객센터</span>
                    <p>0000-0000<br>
                        <span class="txtSmall">상담시간: 오전9시 ~ 오후6시 (토/일, 공휴일 휴무)></span>
                    </p>
                </td>
            </tr>
        </table>
    </div>
</body>

</html>
