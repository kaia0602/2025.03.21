    <title>grid-layout</title>
    <style>
        .container {
            display: grid;
            background-color: black;
            row-gap: 10px;
            /* column-gap: 5px; */
            /* padding: 10px; */
            width: 1100px;
            /* height: 500px; */
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            place-items: center;
            align-content: space-around;
        }

        .layout {
            display: grid;
            background-color: #2E2E47;
            row-gap: 10px;
            column-gap: 10px;
            padding: 8px;
            width: 320px;
            /* margin: 10px; */
        }

        .layout1 {
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: 50px 50px;
        }

        .layout2 {
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: 50px 50px;
        }

        .layout3 {
            grid-template-columns: 80px 230px;
            grid-template-rows: 25px 50px 25px;
        }

        .layout4 {
            grid-template-columns: 95px 55px 150px;
            grid-template-rows: 40px 55px 15px;
        }

        .layout5 {
            grid-template-columns: repeat(6, 45px);
            grid-template-rows: repeat(3, 33.3px);
        }

        .layout6 {
            grid-template-columns: repeat(4, 73px);
            grid-template-rows: repeat(5, 15px);
        }

        .layout7 {
            grid-template-columns: repeat(2, 155px);
            grid-template-rows: 30px 70px;
        }

        .layout7-2 {
            grid-template-columns: repeat(2, 68px);
            grid-template-rows: 28px 28px;
            display: grid;
            row-gap: 3px;
            column-gap: 6px;
            width: 120;
            margin: 1px;
            padding: 5px;

        .layout8 {

        .layout9 {
