<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>건강한 하루</title>
    <style>
        #container {
            background-color: rgb(151, 149, 149);
        }
        .bg {
            background-color: rgb(231, 235, 182);
        }
        .blue {
            color: blue;
        }
        .red {
            color: red;
        }
        .i {
            font-weight: bold;
        }
        
    </style>
</head>
<body>
    <h1 class="bg">건강한 하루</h1>
    <div id="container">
        <h2>건강해지는 차</h2>
        <p>머리와 피부에 좋은 차는 어떤 것들일까. <span class="blue">차의 종류</span>에 대해 알아보도록 합니다</p>
        <ul>
            <li class="bg"><b>대나무차 <span class="red">15,000원</span></b><br>
                얼굴에 물을 주는 효과가 있다.
            </li>
            <li><b>감잎차 <span class="red">14,000원</span></b><br>
                빈혈있는 사람에게 효과가 있다.
            </li>
            <li><b>결명자차 <span class="red">20,000원</span></b><br>
                눈을 밝혀주는 효과가 있다
                보리차와 비슷하나 맛이 더 은은하고 구수하다.
            </li>
        </ul>
    </div>
</body>
</html>
