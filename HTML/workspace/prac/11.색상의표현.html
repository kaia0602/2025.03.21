<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>색상의 표현</title>
    <style>
        body{background-image: url(../HTML/bg_grid2.gif);}
        .p1 {background-color: #FF00FF;}
        .p2 {background-color: #9999FF;}
        .p3 {background-color: #FF8000;}
        .p4 {background-color: #fea44b9c;}
        .p5 {background-color: #B3E6E6;}
        .p6 {background-color: #c8ecec96;}
        /* ALT + SHIFT : 세로로 동시에 드레그 가능 */
        
    </style>
</head>
<body>
    <div>
        <p class="p1">시험일정은 다음과 같습니다.</p>
        <p class="p2">필기시험 : 5월 10일~15일</p>
        <p class="p3">필기 합격 발표 : 5월 30일</p>
        <p class="p4">실기시험 : 6월 12일~17일</p>
        <p class="p5">실기 합격 발표 : 7월 20일</p>
        <p class="p6">행운을 빕니다.</p>
    </div>
</body>
</html>
