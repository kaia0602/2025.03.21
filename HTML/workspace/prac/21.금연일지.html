<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>금연일지</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .header {
            border: 16px solid #B3B6B5;
            background-color: #B3B6B5;
        }

        .logo {
            background-color: #A52A2A;
            color: white;
            position: relative;
            float: left;
            padding: 5px;
            margin: 10px 5px;
            width: 100px;
            text-align: center;
            letter-spacing: 7px;
        }
        
        .main {
            color: #006400;
            width: 510px;
        }

        span {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header"></div>
    <div class="contain">
        <div class="logo"><h1>금연<br>일지</h1></div>
        <div class="main"><span>첫날</span>은 담배 냄새가 나지 않아서 좋았고, 다음날은 <span>눈</span>
        이 맑아진 것같아 좋았고 그 다름 날은 <span>아들</span>에게 당당
        하게 담배 피우지 말라고 말할 수 있어서 좋았다. 개인
        적인 기호를 법적으로만 관리할 수도 없는 것이고 금연
        을 일사불란하게 길행한다는 것은 말도 안되는 일이지
        만, 애연가들 덕분에 그들과 더불어 원치 않게 죽어가는 많은 사람들
        의 넋은 누가 달래야 할 것인가...
        </div>
    </div>
</body>
</html>
