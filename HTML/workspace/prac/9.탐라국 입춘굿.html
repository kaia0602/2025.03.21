<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>탐라국 입춘굿</title>
    <style>
        #container {
            text-align: left;
            width: 500px;
            margin: 10px auto;
            padding: 10px;
        }
        h1 {
            border: 1px;
            box-sizing: border-box;
        }
        .bg {color: white;
            background-color: navy;
        }
        .red {
            color: red;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1><span class="bg">탐라국 입춘굿</span></h1>
        <p>제주도의 문화축제 중에서 유일하게 <span class="red">탐라 시대부터 내려온 축제</span>이다.</p><br>
        <p>제주에서 입춘은 새철 <sup>(제주어, 샛절)</sup> 드는 날이라 한다.</p>
        <p>하늘의 1만 8000신이 지상으로 내려와 새해 일들을 시작하는 때다.</p>
    </div>
    <!-- span - 여백을 차지않고 분리 -->
    <!-- padding - 일정 영역 내부의 공간 -->
</body>
</html>
