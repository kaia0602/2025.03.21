<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30. 함수 연습문제</title>
</head>
<body>
    <script>
        // 반지름을 이용하여 원의 넓이를 구하는 함수를 작성하세요.
        // (반지름)*(반지름)*(3.14)
        function f1(반지름){
            let wei = 반지름 * 반지름 * 3.14
            return console.log(wei)
        }
        f1(5)
        // 매개변수로 배열을 전달받아 배열의 값 중 
        // 가장 큰 수를 찾아 반환하는 함수를 작성하세요.
        function arrMax(arr){
            let result = 0;
            for(let i = 0; i < arr.length; i++){
                if(result < arr[i]) {
                result = arr[i];
            }
            }
            
            return result
        }
        let arr = [5,1,3,2,6,4,7];
        console.log(arrMax(arr));

        // 키와 몸무게를 매개변수로 받아 BMI수치 (몸무게 / (키**2)) 와 
        // 저체중(18.5미만), 과체중(24~25),비만(26이상), 정상을 출력하는 함수를 작성하세요.
        function bmi(키,몸무게){
            BMI수치 = 몸무게 / ((키 / 100) ** 2);
            if(BMI수치 > 26){
                result2 = "비만"
            }else if(BMI수치 > 24 && BMI수치 < 25){
                result2 = '과체중'
            }else if(BMI수치 < 18.5){
                result2 = '저체중'
            }else{
                result2 = "정상"
            }
            return console.log(`BMI수치는 ${BMI수치}, ${result2} 입니다.`);
        }
        bmi(150, 40)
    </script>
</body>
</html>
