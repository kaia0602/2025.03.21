<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통게청 100대 지표</title>
    <style>
        table {
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        .bg {
            background-color: #E5F6F6;
        }

        caption {
            text-align: end;
            caption-side: bottom;
        }
    </style>
</head>

<body>
    <table>
        <caption>출처: 통계청 100대 지표</caption>
        <tr>
            <th>지표</th>
            <th>2019</th>
            <th>2020</th>
            <th>2021</th>
            <th class="bg">2022</th>
        </tr>
        <tr>
            <th>가구수</th>
            <td>20,891,348</td>
            <td>21,484,785</td>
            <td>22,022,753</td>
            <td class="bg">22,383,187</td>
        </tr>
        <tr>
            <th>1인가구</th>
            <td>6,147,516</td>
            <td>6,643,354</td>
            <td>7,165,788</td>
            <td class="bg">7,502,350</td>
        </tr>
    </table>
</body>

</html>
