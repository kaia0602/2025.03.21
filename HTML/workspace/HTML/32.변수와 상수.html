<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var age = 10;
        var age = 20;
        // var: 변수를 의미하는 키워드
        // 변수 이름은 의미가 통하도록 설정
        // =: 대입, 저장의 의미로 사용하는 연산자
        // 10: age 변수에 저장 할 값
        // var의 경우: age를 두번 선언했으나 에러가 발생하지 않음
        let age1 = 10;
        // let age1 = 10;
        // let의 경우 두번 선언하면 에러가 발생함
        // 변수명을 잘못적는 실수를 줄여줌
        var num = 10;
        console.log(num);
        // 호이스팅: 끌어올리기
        // 자바스크립트는 위에서부터 한줄씩 코드를 작성하지만
        // 변수나 함수의 경우 현재 코드보다 아래에 작성된 코드를 사용가능
        // 일반적으로 변수를 사용라여면 사용하는 곳보다 위에 변수를 선언해야됨
        // console.log(num3);
        // num3 = 10;
        // // let의 경우 호이스팅이 안되기 떄문에 잘못된 코드 작성시 에러를 발생시켜 에러의
        // 위치를 알려줌
        // let의 단점: 옛날 브라우저(IE, 업데이트 하지않은 옛날 브라우저)는 실행안됨
        // 자바스크립트의 경우 호이스팅 기능으로 아래에 변수를 적어도 에러가 나지않음
        // 하지만 안의 값은 실행되지 않음

        // const: 상수, 한번 값을 설정하면 더이상 값을 바꿀 수 없음
        // 이름을 대문자로만 작성하고 단어와 단어 사이는 _(언더바)를 사용
        const CM = 100;
        console.log(CM);
        // CM = 1000; : 상수의 값을 변경하려해서 에러가 발생
        // console.log(CM)

        // 식별자 표기법
        // 카멜 표기법(변수 이름): 첫단어의 첫글자는 소문자, 두번째부터는 첫글자를 대문자로
        let firstName = '홍'
        // 언더스코어 표기법(상수, sql): 단어와 단어 사이를 언더바로 이어주는 방식
        let first_name = '홍'
        // 파스칼 표기법(클래스, 함수): 단어의 첫글자를 대문자로 작성
        let FirstName = '홍' 

</script>
</body>
</html>
