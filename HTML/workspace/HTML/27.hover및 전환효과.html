<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hover 및 전환효과 스타일</title>
    <style>
        .pinkBox {
            width: 100px;
            height: 20px;
            background-color: pink;
            transition-property: background-color, width;
            transition-duration: 5s, 5000ms;
            /* transition-duration: 전환이 되는데 걸리는 시간 */
            /* transition-delay: 3s; */
            /* transition-delay: 변경되기 전의 대기시간 설정 */
        }

        .pinkBox:hover {
            background-color: orange;
            width: 200px;
        }

        .ease {
            transition-timing-function: linear;
        }

        .esae-in {
            transition-timing-function: ease-in;
        }

        .ease-out {
            transition-timing-function: ease-out;
        }

        .ease-in-out {
            transition-timing-function: ease-in-out;
        }

        .transition {
            background-color: coral;
            transition: width 10s linear 1s;
            /* transition: property duration timing-function delay */
            width: 100px;
        }

        .transition:hover {
            width: 500px;
        }

    </style>
</head>
<body>
    <div class="pinkBox linear">1</div>
    <div class="pinkBox ease">2</div>
    <div class="pinkBox ease-in">3</div>
    <div class="pinkBox ease-out">4</div>
    <div class="pinkBox ease-in-out">5</div>
    <div class="transition">6</div>
</body>
</html>
