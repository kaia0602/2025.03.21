<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loop</title>
</head>

<body>
    <script>
        // 반복문: 조건식이 true이면 계속 반복하고 false면 반복이 끝나는 명령어
        // 초기값: 반복이 시작될 값
        // while(조건식): 초기값이 false가 될 때까지 확인할 조건식
        //     증강식 : 조건식이 false가 되도록 초기값을 더하거나 빼는 식
        //     실행문
        let start = 0;
        while (start < 10) {
            start++;
            console.log(start + '번째 실행입니다.')
        }

        let value = 0;
        let total = 0;
        while (value < 10) {
            value++;
            total += value;
        }
        console.log(total);

        let num = 0
        let sum = 0
        while (num <= 100) {
            if (num % 2 === 0) {
                sum += num
            }
            num++
        }
        console.log(sum)
        //    템플릿 문자열: `(백틱)으로 문자열을 감싸주는 방식
        // 1. 이스케이프 문자(\'', \"")을 사용하지 않고 바로 사용가능
        // 2. 자바스크립트 변수를 ${} 안에 넣어 바로 사용가능
        console.log(`0~100까지의 짝수의 합은 ${sum} 입니다.`)
        // 무한반복
        // 1. 반복식의 조건문을 잘못 설정했을 경우
        // 2. 증감식을 잘못 설정했을 경우
        // 무한 반복을 사용하는 경우
        // 1. 사용자의 입력값을 확인, 종료하는 경우
        // 2. 특정한 값이 출력 될 때까지 반복하는 경우
        let str = "";
        // while(true){

        // }
        // while(str !== "종료"){
        //     str = prompt("종료라고 입력하면 반복이 종료됩니다.");
        //     console.log(str);
        // }
        // do while문
        do {
            // 실행할코드;
            console.log("무조건");
            console.log("한번은 실행");
        } while (false);

        // for 문 : 반복횟수가 정해져있을때 사용
        // while문은 무한반복이 필요시 사용
        // for(초기값; 조건식; 증감식){
        //실행할 코드
        // }
        for (let start = 0; start <= 5; start++) {
            console.log(start);
        }
        // for문 중첩하기
        for (let start2 = 1; start2 <= 2; start2++) {
            for (let start3 = 0; start3 <= 2; start3++) {
                console.log(`반복문1: ${start2}, 반복문3: ${start3}`)
            }
        }
        // for문과 배열
        let arr = ["banana", "apple", "orange"];
        for (let i = 0; i < arr.length; i++) {
            console.log(arr[i]);
        }
        // arr.legth: arr이라는 배열 안의 데이터의 개수
        // 배열의 시작 인덱스는 0이기에 초기값을 0으로 설정

        // for in문: 객체리터럴이나 배열을 반복할 때 사용하는 반복문
        // 객체 리터럴 반복하기
        let obj = { name: "철수", age: "20" }
        for (let key in obj) {
            console.log(`${key} : ${obj[key]}`);
        }
        // 배열 반복하기
        let arr2 = ['banana', 'orange', 'apple'];
        for(let index in arr2){
            console.log(`${index} : ${arr[index]}`);
        }
        // break;: 현재 반복중인 반복문을 종료하는 명령어
        for(let i = 0; i <= 10; i++){
            console.log(`${i}번째`)
            break;
        }
        let num2 = 0;
        while(true){
            console.log(`무한반복이 실행 안되게 break사용`)
            if(num2 < 100){
            break;
            }
        }
        // continue;: 해당 반복을 건너 뛰고 다음 반복으로 넘어가는 명령어
        for(let i = 1; i < 10; i++){
            if(i % 2 ===0){
                continue;
            }
            console.log(i);
        }
    </script>
</body>

</html>
