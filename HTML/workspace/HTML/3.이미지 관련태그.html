<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지 관련 태그</title>
</head>
<body>
    <!-- 가로나 세로 하나만 설정하는 경우 원본 비율에 맞춰 크기를 조절함 -->
    <div>
        <img src="./images/salad.jpg" alt="salad" width="150px" height="150px">
    </div>
    <!-- 가로크기는 고정되어 있기 때문에 설정할 수 있음-->
    <!--세로는 고정되지 않아 설정할 수 없음  -->
    <div>
        <img src="./images/salad.jpg" alt="salad" width="50%" >
    </div>
    <div style="height: 500px;">
        <img src="./images/salad.jpg" alt="salad">
    </div>
</body>
</html>
