<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>텍스트 관련 스타일</title>
    <style>
        /* color: 글자색상 변경 */
        .p1 { color:hwb(186 4% 78% / 0.612);
                background-color: (#17B75E);
        }
        /* 색상 설정 방법
        1. 글자로 색상을 설정하는 방식: blue, red ...
        2. 16진수로 설정하는 방식: #16진수두자리 
        3. rgb 형식: rgb(red, green, blue) 0~255
        4. RGBA 형식: red, green, blue, alpha(투명도 0~1)
        5. hsl 형식: hsl(색상, 채도, 명도)
        6. hsla 형식: hsla(색상, 채도, 명도, 투명도)
        */
        body{background-image: url(./bg_grid2.gif);}
    </style>
</head>
<body>
    <p class="p1">HTML</p>
    <p class="p2">CSS</p>
    <p class="p3">JavaScript</p>
</body>
</html>
