<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form 조작하기</title>
</head>
<body>
    <form name="frm1">
        <input type="text" name="id">
        <input type="password" name="pw">
    </form>
    <form name="frm2">
        <input type="email" name="email">
        <input type="tel" name="tel">
        <textarea name="desc"></textarea>
    </form>
    <form name="frm3">
        <label><input type="checkbox" name="apple" value="apple">사과</label>
        <label><input type="checkbox" name="banana">바나나</label>
        <label><input type="checkbox" name="orange">오렌지</label>
        <label><input type="checkbox" name="melon">멜론</label>
    </form>
    <form name="frm4">
        <label><input type="radio" name="fruit" value="apple">사과</label>
        <label><input type="radio" name="fruit" value="banana">바나나</label>
        <label><input type="radio" name="fruit" value="orange">오렌지</label>
        <label><input type="radio" name="fruit" value="melon">멜론</label>
    </form>
    <form name="frm5">
        <select name="combobox" id="cb1">
            <option value="apple">apple</option>
            <option value="banana">banana</option>
            <option value="orange" selected>orange</option>
            <option value="melon">melon</option>
        </select>
    </form>
    <form name="frm6">
        <img src="" alt="" id="frm6Img">
        <input type="file" name="upload" onchange="handleFileBtn()">
    </form>
    <script>
        // form 속성 조작하기
        // 폼의 경우 forms를 이용하여 바로 조작가능
        console.log(document.forms);
        console.log(document.forms[0]);
        console.log(document.forms[1]);
        // name 속성을 이용하여 조작하기
        console.log(document.frm1);
        console.log(document.frm2);
        // 위의 방식을 사용하면 querySelector를 사용하지 않고 조작가능

        // form태그 안의 input태그 조작하기
        console.log(document.frm1.id);
        console.log(document.frm1.elements[0]);
        console.log(document.frm1.elements['id']);

        // input태그의 문자열 value 조작하기
        document.frm1.id.value = 'hong';
        document.frm1.pw.value = '1234';
        document.frm2.email.value = 'hong@email.com';
        console.log(document.frm2.email.value);
        document.frm2.desc.value = 'it\'s test area'
        console.log(document.frm2.desc.value)

        // 체크박스 조작하기
        document.frm3.apple.checked = true;
        document.frm3.banana.checked = true;

        const checkboxEls = document.querySelectorAll("[type = 'checkbox']");
        for(let i=0; i < checkboxEls.length; i++){
            if (checkboxEls[i].checked ===true){
                    console.log(checkboxEls[i].value);
            }
        }

        // radio 타입 조작하기
        let radioEls = document.querySelectorAll("[type = 'radio']");
        radioEls[0].checked = true;
        for(let i=0; i < radioEls.length; i++){
            if (radioEls[i].checked ===true){
                    console.log(radioEls[i].value);
            }
        }
        // 콤보박스 조직하기
        let comboboxOptions = document.querySelectorAll('#cb1 option');
        comboboxOptions[2].selected = true;
        for(let i = 0; i < comboboxOptions.length; i++){
            if(comboboxOptions[i].selected === true){
                console.log(comboboxOptions[i].value);
            }
        }

        // 파일 업로드 조작하기
        const handleFileBtn = () => {
            // files는 input태그 안에 들어있는 모든 파일
            const files = document.frm6.upload.files;
            console.log(files[0].name);
            console.log(files[0].size);
            console.log(files[0].type);
            console.log(files[0].lastModifiedDate);
            // 이미지 태그 조작하기
            const frm6Img = document.querySelector('#frm6Ing');
            // 이미지 태그의 src 속에 파일 이름 저장하기
            frm6Img.src = files[0].name;
        }
    </script>

</body>
</html>
