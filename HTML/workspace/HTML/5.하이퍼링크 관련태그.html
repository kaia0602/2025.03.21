<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하이퍼링크 관련 태그</title>
</head>
<body>
    <!-- 하이퍼링크: 태그를 누르면 다른 페이지로 이동하는 태그 -->
    <!-- a 태그: href 속성에 html 파일이나 인터넷 주소를 넣어 페이지를 이동 -->
    <a href="./1. 텍스트 관련태그.html">텍스트 관련 태그</a><br>
    <a href="https://www.naver.com/">naver</a><br>
    <a href="https://www.ebs.co.kr/">ebs</a><br>
    <!-- <-- image link -->
    <a href="https://www.ebs.co.kr/">
        <img src="../images/link.png" alt="images">
    </a><br>
    <a href="https://www.naver.com/">
        <img src="../네이버.png" alt="naver" >
    </a>
    <a href="https://www.daum.net/">
        <img src="../다음.png" alt="daum" >
    </a>
    <a href="https://www.google.com/">
        <img src="../구글.png" alt="google" >
    </a> 
    <!-- target 속성: 링크를 클릭했을떄 새로운 탭을 열어주는 속성 -->
    <a href="./2. 테이블 관련태그.html" target="_blank">타겟 속성 확인</a>
    <!-- a 태그의 앵커 기능: 페이지 안에서 특정 태그로 이동하는 기능 -->
    <a href="#">가장 위로 이동</a>
    <a href="#HTML">HTML로 이동</a>
    <a href="#CSS">CSS로 이동</a>
    <a href="#JS">JS로</a>
    <div id="HTML">
        <p>HTML1</p> <p>2</p> <p>3</p> <p>4</p> <p>5</p> <p>6</p> <p>7</p> <p>8</p> <p>9</p> <p>0</p>
    </div>
    <div id="CSS">
        <p>CSS1</p> <p>2</p> <p>3</p> <p>4</p> <p>5</p> <p>6</p> <p>7</p> <p>8</p> <p>9</p> <p>0</p>
    </div>
    <div id="JS">
        <p>JS1</p> <p>2</p> <p>3</p> <p>4</p> <p>5</p> <p>6</p> <p>7</p> <p>8</p> <p>9</p> <p>0</p>
    </div>
    <a href="#">가장 위로 이동</a>
    <!-- #뒤에 id 속성의 값을 넣으면 해당 id를 가진 태그 이동 -->
   
</body>
</html>
