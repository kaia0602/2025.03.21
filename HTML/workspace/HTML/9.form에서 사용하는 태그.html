<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form에서 사용하는 태그</title>
</head>
<body>
    <form action="">
        <textarea name="textarea" style="resize: none;" cols="20" rows="10">send data</textarea>
        <!-- textarea 태그: 여러줄의 텍스트 입력 ex.게시글, 약관 -->
        <!-- cols: 가로크기 -->
        <!-- rows: 세로크기 -->
        <!-- style="resize: none: 크기고정 -->
         <br>
         <select name="select">
            <option value="special_3">선물용 3kg</option>
            <option value="special_5">선물용 5kg</option>
            <option value="famliy_3" selected>가정용 3kg</option>
            <!-- selected 속성: 화면이 뜰때 설정되는 기본 값 -->
            <option value="famliy_5">가정용 5kg</option>
            <!-- value 속성 사용시 value가 있는 데이터를 전달하고
             없다면 시작과 종료태그 사이의 데이터를 전달 -->
         </select>
        <button>send</button>
    </form>
</body>
</html>
