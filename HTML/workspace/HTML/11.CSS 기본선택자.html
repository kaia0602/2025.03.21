<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 기본선택자</title>
    <style>
        * {margin: 0; padding: 0;}
        /* 전체선택자 : 페이지에 있는 모든 태그를 대상으로 CSS를 적용*/
        /* 페이지의 기본 스타일을 초기화 할때 사용 */
        p {font-style: italic;}
        /* 타입 선택자: 특정 이름의 태그를 모두 대상으로 적용하는 선택자 */
        .accent{
            border: 1px solid #000;
            padding: 5px;
        }
        /* 클래스 선택자
        1. 마침표를 클래스 이름 앞에 사용하여 클래스 선택자를 설정 
        2. 클래스 선택자는 여러 태그에서 사용가능
        3. 클래스 속성 안에 여러 클래스 선택자를 설정가능 
        CSS에서 가장 많이 사용*/
        .bg {
            background-color: #ddd;
        }
        .bg {
            background-color: aqua;
        }
        /* 같은 우선순위의 설정이 있을 경우 마지막 내용이 적용 */
        #container{
            width: 500px;
            margin: 10px auto;
            padding: 10px;
            border: 1px solid #000;
        }
        /* id 선택자: id 속성의 값앞에 #을 붙여 사용
            id 속성값은 중복사용 불가 */
        h1, p {
            text-align: center;
        }
        /* 그룹 선택자: 콤마를 이용하여 선택자를 여러개 나열하는 방식 */
        /* CSS 우선순위
        1. !important: 최우선 순위이기에 어떤 CSS설정도 무시
        2. 인라인 스타일: 일반적으로 사용하지않음, 테스트용도
        3. id 스타일: 자유롭게 사용가능, 클래스보다 우선순위일때 사용
        4. 클래스 스타일: CSS에서 가장 많이 사용
        5. 타입 스타일: 클래스보다 여러 태그에 사용해야 할때 */
    </style>
</head>
<body>
    <div id="container">
        <h1 class="accent bg">레드향</h1>
        <p>껍질에 붉은 빛이 돌아 <span class="accent">레드향</span>이라 불린다</p>
        <p>레드향은 한라봉과 귤을 교배한 것으로 일반 귤보다 2~3배 크고 과육이 붉고 통통하다</p>
        <p>비타민 c와 비타민 p가 풍부해 혈액순환, 감기예방 등에 좋은 것으로 알려져 있다.</p>
        <!-- span: 크기를 가지지 않는 CSS를 적용하기 위한 태그 -->
        <!-- div: 특정한 크기를 가지는 태그로 구조를 만들때 사용하는 태그 -->
    </div>
</body>
</html>
