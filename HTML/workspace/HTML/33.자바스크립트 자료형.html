<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 변수에 문자열 저장하기
        let name = '홍길동';
        let name2 = "홍길동";
        // 작은따옴표나 큰따움표로 감싸서 문자를 저장해야함
        // 감싸지 않으면 변수명으로 인식됨
        // 문자열 더하기
        console.log(name + '입니다.');
        let name3 = name + '입니다.';
        console.log(name3);
        // 문자열 안에 '', ""를 사용해야 할때
        // 이스케이프 문자(\)를 이용하여 표시할 수 있음
        // \', \": 역슬래시를 붙여 문자열로 표시
        // \n: 엔터키
        // \\: 역슬래시 한개로 표기됨
        alert('안녕하세요 저는 \"이순신\"입니다.\n오늘은 4월 3일 입니다.')
        // 숫자 자료형
        let num = 10;
        let num2 = 20.5;
        let num3 = num + num2;
        console.log(num3);
        // 논리 자료형: true나 false를 저장하는 자료형
        let bool = true;
        let bool2 = false;
        // undifined: 단 한번도 값을 저장하지 않은 변수에 설정되는 값
        let unde;
        console.log(unde);
        // null: 데이터가 없음을 설정하는 값
        let nu = null;
        console.log(nu);
        // 객체 자료형: 여러가지 데이터를 묶어놓거나 함수가 들어있는 데이터
        // 위의 다섯가지를 제외한 나머지 대부분의 자료형
        // 배열: 하나의 이름으로 여러개의 값을 저장할 수 있는 자료형
        let scores = [100, 90, 80, 70, 60, 50];
        let subjects = ['국어', '수학', '영어', '과학', '사회'];
        // 첫번째 데이터의 주소(인덱스)가 0부터 시작한다. 
        console.log(subjects[0] + '는' + scores[0] + '점입니다.');
        console.log(subjects[1] + '는' + scores[1] + '점입니다.');
        console.log(subjects[2] + '는' + scores[2] + '점입니다.');
        // 객체 리터럴: key:value로 이루어진 데이터
        let studentScore = {
            koreanScore:80,
            englishScore:70,
            mathScore:60
        };
        console.log(studentScore.koreanScore);
        console.log(studentScore['englishScore']);
        // 대괄호 표기법을 사용할 때는 접근 연산자 내부에 지정하는 프로퍼티 키는 반드시 따옴표로 감싼 문자열이어야 한다.
        // 객체에 존재하지 않는 프로퍼티에 접근하면 undefined를 반환한다.
    </script>
</body>
</html>
