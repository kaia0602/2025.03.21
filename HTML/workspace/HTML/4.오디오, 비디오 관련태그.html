<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오디오, 비디오 관련 태그</title>
</head>
<body>
    <object data="./medias/flower.mp4" width="1000px" height="800px"></object>
    <embed src="./medias/flight.mp4" width="800px" height="600px">
    <!-- -embed: 오래된 브라우저에서 멀티미디어 파일을 출력하는 태그 -->
    <audio src="./medias/spring.mp3" controls muted></audio>
    <!-- audio 태그에서 autoplay는 실행되지 않음 -->
    <video src="./medias/salad.mp4" controls muted autoplay loop></video>
    <!-- video 태그의 경우 muted와 autoplay 함께 사용하여 자동재생 실행 -->
    <iframe width="560" height="315" src="https://www.youtube.com/embed/JVRWw_-VFII?si=CpRbXUg1inqxDBM7" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <!-- youtube 퍼가기 기능 사용 -->
    <!-- ifrom 태그: html 파일 안에 html 파일을 실행하는 태그 -->
    <iframe src="./2. 테이블 관련태그.html" frameborder="0"></iframe>
</body>
</html>
